# Db + Backend + Frontend on Docker
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${DB_NAME:nice}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true


logging:
  level:
    root: WARN
    fr.dev.map: INFO
