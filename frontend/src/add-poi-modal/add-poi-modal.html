<div class="overlay">
    <div class="content">
        <h3 class="title-h3">Add a marker</h3>
        <input [(ngModel)]="label" placeholder="Label"                  class="form-input" />
        <input [(ngModel)]="desc"  placeholder="Description (optional)" class="form-input" />
        <div class="actions">
            <button class="btn-1" (click)="onCancel()">Cancel</button>
            <button class="btn-2" (click)="onAdd()">Add</button>
        </div>
    </div>
</div>
